strategy:
  type: sparse_switch_mv
  rebalance_minutes: 375
  lookback_bars: 260
  estimation_frequency: "1d"
  mean_lookback_periods: 60
  cov_lookback_periods: 120
  support_k: 30
  lambda_risk: 50 #50
  kappa_switch: 10 #10
  step_size: 0.5
  cov_shrinkage: 0.10
  cov_epsilon: 1.0e-5
  persistence_bonus: 0.02
  min_history_periods: 40
  max_weight_per_asset: 0.15
  warm_start: true
  verbose_debug: false
  # Telemetry-only estimation-regret diagnostic from the progress report.
  # This does not change support selection, optimization, or execution.
  # It publishes dashboard-friendly scalars: regret and cum_regret.
  track_regret: true
  publish_regret: true
  regret_mode: estimation_gap
  regret_publish_on: rebalance
  regret_publish_fields:
    - last_estimation_regret
    - cumulative_estimation_regret
    - positive_estimation_regret
    - mean_abs_estimation_gap
    - regret_count
    - estimated_loss
    - observed_loss
