strategy:
  type: sparse_switch_mv
  rebalance_minutes: 375
  lookback_bars: 260
  estimation_frequency: "1d"
  mean_lookback_periods: 60
  cov_lookback_periods: 120
  support_k: 60
  lambda_risk: 100 #50
  kappa_switch: 10 #10
  step_size: 0.5
  cov_shrinkage: 0.10
  cov_epsilon: 1.0e-5
  persistence_bonus: 0.02
  min_history_periods: 40
  max_weight_per_asset: 0.15
  warm_start: true
  verbose_debug: false

  # Telemetry-only one-step hindsight return regret.
  # At decision time the strategy chooses w_est using past/estimated data.
  # After the next daily return is known, the strategy reruns the same optimizer
  # using that realized daily return as the seen return signal, producing w_seen.
  # Published regret is max(0, r^T w_seen - r^T w_est), so cum_regret is non-decreasing.
  # This does not change the traded portfolio or support-selection logic.
  track_regret: true
  publish_regret: true
  regret_mode: hindsight_return_gap

  # Keep regret in every learn payload after it is first computed. Fast backtests
  # batch ZMQ messages, so one-shot regret telemetry can be overwritten before
  # the dashboard receives it.
  regret_publish_on: every_publish
  regret_publish_fields:
    - return_regret
    - cumulative_return_regret
    - raw_return_gap
    - actual_portfolio_return
    - hindsight_portfolio_return
    - mean_abs_return_gap
    - regret_count
    - estimated_objective
    - hindsight_objective
